# Example Apache vhost for I Am President.
# Needs: mod_rewrite, mod_proxy, mod_proxy_http, mod_proxy_wstunnel
#   sudo a2enmod rewrite proxy proxy_http proxy_wstunnel
#
# Set conf.php 'realtime-ws-url' to wss://yourhost/ws so the browser connects here.

<VirtualHost *:80>
    ServerName yourhost.example.com
    DocumentRoot /var/www/iampresident/public

    <Directory /var/www/iampresident/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All          # lets public/.htaccess do the routing
        Require all granted
    </Directory>

    # Reverse-proxy the WebSocket relay. Browser uses wss://yourhost/ws?match_id=…
    ProxyPreserveHost On
    ProxyPass        /ws  ws://127.0.0.1:8081/
    ProxyPassReverse /ws  ws://127.0.0.1:8081/

    ErrorLog  ${APACHE_LOG_DIR}/iampresident_error.log
    CustomLog ${APACHE_LOG_DIR}/iampresident_access.log combined
</VirtualHost>

# For HTTPS, put the same DocumentRoot/Directory/Proxy blocks in a *:443
# vhost with your TLS certs; the WS proxy line can stay ws:// to the local node.
