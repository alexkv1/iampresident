<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--bg-page);color:var(--text-body);font-family:var(--font-body)}body{padding:18px}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 3px 0 rgba(0,0,0,.35)}.n{font:600 12px/1.2 var(--font-body);color:var(--text-strong);margin-top:7px}.v{font:400 11px/1.2 ui-monospace,Menlo,monospace;color:var(--text-muted);margin-top:2px}.lbl{font:500 11px/1 var(--font-body);color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}.rd{width:80px;height:64px;background:var(--grad-navy);border:1px solid var(--navy-500);box-shadow:0 3px 0 var(--navy-950)}</style></head><body><div class="row" style="gap:16px"><div><div class="rd" style="border-radius:4px"></div><div class="n">--radius-xs</div><div class="v">4px</div></div><div><div class="rd" style="border-radius:9px"></div><div class="n">--radius-row</div><div class="v">9px</div></div><div><div class="rd" style="border-radius:10px"></div><div class="n">--radius</div><div class="v">10px</div></div><div><div class="rd" style="border-radius:12px"></div><div class="n">--radius-tag</div><div class="v">12px</div></div><div><div class="rd" style="border-radius:14px"></div><div class="n">--radius-panel</div><div class="v">14px</div></div><div><div class="rd" style="border-radius:16px"></div><div class="n">--radius-card</div><div class="v">16px</div></div><div><div class="rd" style="border-radius:999px"></div><div class="n">--radius-pill</div><div class="v">999px</div></div></div></body></html>
