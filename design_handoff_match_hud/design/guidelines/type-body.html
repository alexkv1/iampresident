<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--bg-page);color:var(--text-body);font-family:var(--font-body)}body{padding:18px}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 3px 0 rgba(0,0,0,.35)}.n{font:600 12px/1.2 var(--font-body);color:var(--text-strong);margin-top:7px}.v{font:400 11px/1.2 ui-monospace,Menlo,monospace;color:var(--text-muted);margin-top:2px}.lbl{font:500 11px/1 var(--font-body);color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}</style></head><body><div style="font:500 17px/1.3 var(--font-body);color:#fff">Feed your people. Mine resources. Trade. Build an army.</div><p style="font:400 15px/1.45 var(--font-body);margin:8px 0 0;max-width:600px">Food‑poor nations must farm hard or trade with food‑rich ones. Energy gates output, so power matters. Spin the globe and click a country to lead.</p><div style="display:flex;gap:22px;margin-top:14px;align-items:baseline"><span style="font:600 14px var(--font-body);color:#fff">600 · Player name</span><span style="font:500 13px var(--font-body);color:var(--text-muted)">500 · Label</span><span style="font:400 13px var(--font-body)">400 · Dispatch</span><span style="font:400 11px var(--font-body);color:var(--text-muted)">400 · 11px meta</span></div></body></html>
