<!-- @dsCard group="Type" viewport="700x140" name="HUD numerals" subtitle="Condensed tabular numbers for stockpiles, days, stats" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--bg-page);color:var(--text-body);font-family:var(--font-body)}body{padding:18px}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 3px 0 rgba(0,0,0,.35)}.n{font:600 12px/1.2 var(--font-body);color:var(--text-strong);margin-top:7px}.v{font:400 11px/1.2 ui-monospace,Menlo,monospace;color:var(--text-muted);margin-top:2px}.lbl{font:500 11px/1 var(--font-body);color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}.num{font:var(--type-hud-value);font-size:40px;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(0,0,0,.4)}</style></head><body><div class="row" style="gap:34px;align-items:flex-end"><div><div class="num" style="color:var(--res-food)">1.84K</div><div class="lbl">food</div></div><div><div class="num" style="color:var(--res-gold)">12.5K</div><div class="lbl">gold</div></div><div><div class="num" style="color:var(--res-energy)">412</div><div class="lbl">energy</div></div><div><div class="num" style="color:#fff;font-style:italic;font-weight:900">DAY 14</div><div class="lbl">tick clock</div></div><div><div class="num" style="color:#fff">51.7M</div><div class="lbl">pop · UI.num()</div></div></div></body></html>
