<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--bg-page);color:var(--text-body);font-family:var(--font-body)}body{padding:18px}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 3px 0 rgba(0,0,0,.35)}.n{font:600 12px/1.2 var(--font-body);color:var(--text-strong);margin-top:7px}.v{font:400 11px/1.2 ui-monospace,Menlo,monospace;color:var(--text-muted);margin-top:2px}.lbl{font:500 11px/1 var(--font-body);color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}.bg{flex:1;height:130px;border-radius:12px;display:flex;align-items:flex-end;padding:10px;font:500 11px ui-monospace,Menlo,monospace;color:#fff;border:1px solid var(--navy-600)}</style></head><body><div class="row" style="gap:12px"><div class="bg" style="background:var(--grad-page)">--grad-page</div><div class="bg" style="background:var(--grad-hero)">--grad-hero</div><div class="bg" style="background:var(--pattern-stripes),var(--grad-sky)">--pattern-stripes</div><div class="bg" style="background:var(--grad-protect-b),var(--grad-sky)">--grad-protect-b</div></div></body></html>
