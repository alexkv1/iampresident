<!-- @dsCard group="Spacing" viewport="700x190" name="Elevation & lips" subtitle="Pressables sit on a solid lip; overlays float with soft shadow" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--bg-page);color:var(--text-body);font-family:var(--font-body)}body{padding:18px}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 3px 0 rgba(0,0,0,.35)}.n{font:600 12px/1.2 var(--font-body);color:var(--text-strong);margin-top:7px}.v{font:400 11px/1.2 ui-monospace,Menlo,monospace;color:var(--text-muted);margin-top:2px}.lbl{font:500 11px/1 var(--font-body);color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}.e{width:140px;height:80px;border-radius:12px;display:grid;place-items:center;font:500 11px ui-monospace,Menlo,monospace;color:#fff;text-align:center}</style></head><body><div class="row" style="gap:22px;align-items:center"><div class="e" style="background:var(--grad-gold);color:var(--gold-900);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 4px 0 var(--gold-700),0 10px 14px rgba(0,0,0,.3)">--lip-gold</div><div class="e" style="background:var(--grad-teal);color:var(--teal-900);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 4px 0 var(--teal-700),0 10px 14px rgba(0,0,0,.3)">--lip-teal</div><div class="e" style="background:var(--grad-navy);border:1px solid var(--navy-500);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 4px 0 var(--navy-950)">--lip-navy</div><div class="e" style="background:var(--grad-panel);border:1px solid var(--border-glow);box-shadow:var(--shadow-panel),var(--shadow-sheen)">--shadow-panel</div><div class="e" style="background:var(--navy-850);border:2px solid var(--navy-600);box-shadow:var(--shadow-inset-well)">--shadow-inset-well</div></div></body></html>
