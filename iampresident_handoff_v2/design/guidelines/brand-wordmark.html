<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--bg-page);color:var(--text-body);font-family:var(--font-body)}body{padding:18px}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 3px 0 rgba(0,0,0,.35)}.n{font:600 12px/1.2 var(--font-body);color:var(--text-strong);margin-top:7px}.v{font:400 11px/1.2 ui-monospace,Menlo,monospace;color:var(--text-muted);margin-top:2px}.lbl{font:500 11px/1 var(--font-body);color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}.wm{filter:drop-shadow(0 4px 0 rgba(6,10,20,.6));text-transform:uppercase;display:flex;flex-direction:column}.a{font:italic 900 30px/1 var(--font-display);color:#fff;letter-spacing:.14em;padding-left:.12em}.b{font:italic 900 84px/.86 var(--font-display);background:linear-gradient(180deg,#fff4cf 0%,#ffd864 38%,#f5b942 62%,#d89a28 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em}</style></head><body><div style="display:flex;align-items:center;gap:40px;height:100%;background:var(--grad-hero);margin:-18px;padding:24px 28px;min-height:220px;box-sizing:border-box"><div class="wm"><span class="a">I Am</span><span class="b">President</span></div><div style="font:500 15px/1.5 var(--font-body);color:var(--text-muted);max-width:240px">Lead a nation. Feed your people. Dominate the world.</div></div></body></html>
