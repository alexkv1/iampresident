<!-- @dsCard group="Colors" viewport="700x170" name="Gradients" subtitle="Vertical light→dark "game plastic" fills" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--bg-page);color:var(--text-body);font-family:var(--font-body)}body{padding:18px}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 3px 0 rgba(0,0,0,.35)}.n{font:600 12px/1.2 var(--font-body);color:var(--text-strong);margin-top:7px}.v{font:400 11px/1.2 ui-monospace,Menlo,monospace;color:var(--text-muted);margin-top:2px}.lbl{font:500 11px/1 var(--font-body);color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}.g{flex:1;height:90px;border-radius:12px;display:flex;align-items:flex-end;padding:8px;font:500 11px/1 ui-monospace,Menlo,monospace;box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 4px 0 rgba(0,0,0,.4)}</style></head><body><div class="row"><div class="g" style="background:var(--grad-gold);color:var(--gold-900)">gold</div><div class="g" style="background:var(--grad-teal);color:var(--teal-900)">teal</div><div class="g" style="background:var(--grad-sky);color:#fff">sky</div><div class="g" style="background:var(--grad-navy);color:#fff">navy</div><div class="g" style="background:var(--grad-danger);color:#fff">danger</div><div class="g" style="background:var(--grad-card);color:#fff">card</div><div class="g" style="background:var(--grad-page);color:#fff">page</div><div class="g" style="background:var(--grad-hero);color:#fff">hero</div></div></body></html>
