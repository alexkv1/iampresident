<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--bg-page);color:var(--text-body);font-family:var(--font-body)}body{padding:18px}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 3px 0 rgba(0,0,0,.35)}.n{font:600 12px/1.2 var(--font-body);color:var(--text-strong);margin-top:7px}.v{font:400 11px/1.2 ui-monospace,Menlo,monospace;color:var(--text-muted);margin-top:2px}.lbl{font:500 11px/1 var(--font-body);color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}.d{font-family:var(--font-display);font-style:italic;text-transform:uppercase;color:#fff;text-shadow:var(--text-shadow-display);line-height:.95}</style></head><body><div class="d" style="font-size:72px;font-weight:900">Dominate the world</div><div class="d" style="font-size:48px;font-weight:900;margin-top:8px;color:var(--gold-400)">Lead a nation</div><div style="display:flex;gap:24px;margin-top:12px;align-items:baseline"><span class="d" style="font-size:34px;font-weight:800">World standings</span><span class="d" style="font-size:26px;font-weight:800">Build</span><span class="d" style="font-size:20px;font-weight:800">Start match</span><span class="v">--font-display · 900 / 800 italic</span></div></body></html>
