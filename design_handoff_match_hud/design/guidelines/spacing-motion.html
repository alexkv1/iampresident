<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--bg-page);color:var(--text-body);font-family:var(--font-body)}body{padding:18px}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 3px 0 rgba(0,0,0,.35)}.n{font:600 12px/1.2 var(--font-body);color:var(--text-strong);margin-top:7px}.v{font:400 11px/1.2 ui-monospace,Menlo,monospace;color:var(--text-muted);margin-top:2px}.lbl{font:500 11px/1 var(--font-body);color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}@keyframes pop{0%,30%{transform:scale(.85);opacity:.3}60%,100%{transform:scale(1);opacity:1}}.m{width:56px;height:56px;border-radius:12px;background:var(--grad-gold);box-shadow:0 4px 0 var(--gold-700)}</style></head><body><div class="row" style="gap:40px;align-items:center"><div style="text-align:center"><div class="m" style="animation:pop 1.6s var(--ease-pop) infinite"></div><div class="n">--ease-pop</div><div class="v">cubic-bezier(.34,1.56,.64,1)</div></div><div style="text-align:center"><div class="m" style="background:var(--grad-teal);box-shadow:0 4px 0 var(--teal-700);animation:bob 1.6s var(--ease-out) infinite"></div><div class="n">--ease-out</div><div class="v">cubic-bezier(.2,.8,.2,1)</div></div><div class="v" style="max-width:280px;line-height:1.6">Press: translateY(3px) + lip 4→1px. Hover: −1px lift + brightness(1.08). Globe auto-spins 0.0007 rad/frame; focus eases 8%/frame.</div></div></body></html>
