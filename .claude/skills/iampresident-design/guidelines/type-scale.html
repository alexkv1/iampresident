<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--bg-page);color:var(--text-body);font-family:var(--font-body)}body{padding:18px}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 3px 0 rgba(0,0,0,.35)}.n{font:600 12px/1.2 var(--font-body);color:var(--text-strong);margin-top:7px}.v{font:400 11px/1.2 ui-monospace,Menlo,monospace;color:var(--text-muted);margin-top:2px}.lbl{font:500 11px/1 var(--font-body);color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}.r{display:flex;align-items:baseline;gap:16px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04)}.k{width:150px;flex-shrink:0;font:400 11px ui-monospace,Menlo,monospace;color:var(--text-muted)}</style></head><body><div class="r"><span class="k">--fs-display-lg 48</span><span style="font:var(--type-h1);text-transform:uppercase;color:#fff">Conquer</span></div><div class="r"><span class="k">--fs-display-md 34</span><span style="font:var(--type-h2);text-transform:uppercase;color:#fff">Your nation</span></div><div class="r"><span class="k">--fs-display-sm 26</span><span style="font:var(--type-h3);text-transform:uppercase;color:#fff">Play Online</span></div><div class="r"><span class="k">--fs-display-xs 20</span><span style="font:var(--type-panel-title);text-transform:uppercase;color:#fff">Dispatches</span></div><div class="r"><span class="k">--fs-15 body</span><span style="font:var(--type-body)">Spin the globe and click a country to lead.</span></div><div class="r"><span class="k">--fs-13 label</span><span style="font:var(--type-label);color:var(--text-muted)">Your name</span></div><div class="r"><span class="k">--fs-11 meta</span><span style="font:var(--type-meta);color:var(--text-muted)">3/8 players · 20s/tick</span></div></body></html>
