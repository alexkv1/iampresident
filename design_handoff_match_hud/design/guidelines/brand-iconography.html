<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;background:var(--bg-page);color:var(--text-body);font-family:var(--font-body)}body{padding:18px}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 3px 0 rgba(0,0,0,.35)}.n{font:600 12px/1.2 var(--font-body);color:var(--text-strong);margin-top:7px}.v{font:400 11px/1.2 ui-monospace,Menlo,monospace;color:var(--text-muted);margin-top:2px}.lbl{font:500 11px/1 var(--font-body);color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}.ic{display:flex;flex-direction:column;align-items:center;gap:6px;width:62px}.t{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:24px;color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(0,0,0,.18)),var(--c);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 0 rgba(0,0,0,.35)}.t i{filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}.v{text-align:center}</style></head><body><div class="row" style="flex-wrap:wrap;gap:8px 6px"><div class="ic"><div class="t" style="--c:var(--res-food)"><i class="ph-fill ph-grains"></i></div><div class="v">farm</div></div><div class="ic"><div class="t" style="--c:var(--navy-400)"><i class="ph-fill ph-hammer"></i></div><div class="v">mine</div></div><div class="ic"><div class="t" style="--c:var(--res-oil)"><i class="ph-fill ph-gas-pump"></i></div><div class="v">oil rig</div></div><div class="ic"><div class="t" style="--c:var(--gold-600)"><i class="ph-fill ph-lightning"></i></div><div class="v">power</div></div><div class="ic"><div class="t" style="--c:var(--red-600)"><i class="ph-fill ph-factory"></i></div><div class="v">factory</div></div><div class="ic"><div class="t" style="--c:var(--teal-600)"><i class="ph-fill ph-flask"></i></div><div class="v">lab</div></div><div class="ic"><div class="t" style="--c:var(--sky-500)"><i class="ph-fill ph-bank"></i></div><div class="v">bank</div></div><div class="ic"><div class="t" style="--c:var(--green-600)"><i class="ph-fill ph-house-line"></i></div><div class="v">housing</div></div><div class="ic"><div class="t" style="--c:var(--sky-500)"><i class="ph-fill ph-globe-hemisphere-west"></i></div><div class="v">online</div></div><div class="ic"><div class="t" style="--c:#8a63c4"><i class="ph-fill ph-lock-key"></i></div><div class="v">private</div></div><div class="ic"><div class="t" style="--c:var(--gold-600)"><i class="ph-fill ph-robot"></i></div><div class="v">single</div></div><div class="ic"><div class="t" style="--c:var(--gold-500)"><i class="ph-fill ph-trophy"></i></div><div class="v">victory</div></div><div class="ic"><div class="t" style="--c:var(--red-500)"><i class="ph-fill ph-sword"></i></div><div class="v">conquest</div></div><div class="ic"><div class="t" style="--c:var(--navy-500)"><i class="ph-fill ph-skull"></i></div><div class="v">defeated</div></div></div><div style="display:flex;gap:16px;margin-top:12px;color:var(--text-muted);font-size:18px"><i class="ph-bold ph-user"></i><i class="ph-bold ph-magnifying-glass"></i><i class="ph-bold ph-caret-down"></i><i class="ph-bold ph-paper-plane-right"></i><i class="ph-bold ph-sign-out"></i><i class="ph-bold ph-copy"></i><span class="v" style="font-size:11px;align-self:center">Bold weight — inputs, utility</span></div></body></html>
